<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #f4f7f6; --card-bg: #fff; --text: #333; --text-muted: #555;
            --border: #ccc; --input-bg: #fff;
            --gold: #eab308; --gold-hover: #ca8a04; --gold-light: #fef08a; --gold-text: #854d0e;
            --red: #ef4444; --red-hover: #dc2626; --red-light: #fee2e2; --red-text: #991b1b; --red-border: #f87171;
            --green: #22c55e; --green-hover: #16a34a;
            --indigo: #6366f1; --indigo-hover: #4f46e5;
            --inactive-bg: #f3f4f6; --inactive-text: #555; --inactive-border: #ccc;
            --overlay-bg: rgba(0,0,0,0.35); --toast-bg: #fff; --toast-text: #333;
        }
        html.dark {
            --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --text-muted: #94a3b8;
            --border: #334155; --input-bg: #0f172a;
            --gold-light: #854d0e; --gold-text: #fde68a;
            --red-light: #450a0a; --red-text: #fca5a5; --red-border: #991b1b;
            --inactive-bg: #334155; --inactive-text: #94a3b8; --inactive-border: #475569;
            --overlay-bg: rgba(0,0,0,0.6); --toast-bg: #1e293b; --toast-text: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; }
        .form-container { background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h2 { text-align: center; color: var(--text); margin-bottom: 10px; margin-top: 0; }

        .action-mode-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .action-btn { flex: 1; padding: 12px; border: 2px solid var(--inactive-border); background: var(--inactive-bg); color: var(--inactive-text); font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; font-size: 14px; }
        .action-btn.active-add { background: var(--gold); color: #fff; border-color: var(--gold-hover); }
        .action-btn.active-deduct { background: var(--red); color: #fff; border-color: var(--red-hover); }

        label { font-weight: bold; display: block; margin-top: 15px; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; background: var(--input-bg); color: var(--text); }
        select option { background: var(--card-bg); color: var(--text); }
        textarea { resize: vertical; height: 70px; }

        .toggle-group { display: flex; gap: 10px; margin-top: 10px; }
        .toggle-btn { flex: 1; padding: 10px; border: 2px solid var(--gold); background: var(--card-bg); color: var(--text); font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; font-size: 14px; }
        .toggle-btn.active { background: var(--gold); color: #fff; }

        .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { background: var(--gold-light); color: var(--gold-text); padding: 4px 10px; border-radius: 12px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .tag .tag-remove { cursor: pointer; color: var(--red); font-weight: bold; }

        .add-row { display: flex; gap: 8px; margin-top: 5px; }
        .add-btn { width: auto; background: var(--indigo); padding: 10px 16px; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .add-btn:hover { background: var(--indigo-hover); }

        button[type="submit"] { width: 100%; background-color: var(--gold); color: #fff; padding: 12px; border: none; border-radius: 6px; margin-top: 25px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button[type="submit"].deduct-mode { background-color: var(--red); }
        button[type="submit"].deduct-mode:hover { background-color: var(--red-hover); }
        button[type="submit"]:hover { background-color: var(--gold-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg { color: var(--red); font-size: 12px; display: none; margin-top: 4px; font-weight: bold; }
        .balance-error { background-color: var(--red-light); color: var(--red-text); padding: 12px; border-radius: 8px; border: 1px solid var(--red-border); margin-top: 15px; font-size: 13px; font-weight: bold; display: none; line-height: 1.5; }

        .toast-overlay { position: fixed; inset: 0; background: var(--overlay-bg); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn .2s ease; }
        .toast-box { background: var(--toast-bg); padding: 24px 28px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.18); max-width: 340px; width: 90%; text-align: center; animation: scaleIn .25s ease; }
        .toast-box p { margin: 0 0 18px; font-size: 15px; color: var(--toast-text); line-height: 1.5; }
        .toast-box button { background: var(--gold); color: #fff; border: none; padding: 10px 32px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .toast-box.success-toast button { background: var(--green); }
        .toast-box.error-toast button { background: var(--red); }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        @keyframes scaleIn { from { transform: scale(.92); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    </style>
</head>

/* ── Toast (replaces alert) ── */
function showToast(message, type) {
    var boxClass = 'toast-box';
    if (type === 'success') boxClass += ' success-toast';
    else if (type === 'error') boxClass += ' error-toast';
    var overlay = document.createElement('div');
    overlay.className = 'toast-overlay';
    overlay.innerHTML = '<div class="' + boxClass + '"><p>' + message + '</p><button onclick="this.closest(\'.toast-overlay\').remove()">OK</button></div>';
    document.body.appendChild(overlay);
}

/* ── Helpers ── */
function escapeHTML(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function normalizeStr(str) {
    return str ? str.replace(/"/g, '').replace(/\s+/g, ' ').trim().toLowerCase() : '';
}

function parseCSVRow(rowText) {
    var result = [], insideQuote = false, entry = '';
    for (var i = 0; i < rowText.length; i++) {
        var ch = rowText[i];
        if (ch === '"') { insideQuote = !insideQuote; }
        else if (ch === ',' && !insideQuote) { result.push(entry.trim()); entry = ''; }
        else { entry += ch; }
    }
    result.push(entry.trim());
    return result;
}

function sumStarsFromCSV(csvText, targets) {
    if (!csvText || !csvText.trim()) return {};
    var lines = csvText.split(/\r?\n/);
    var sums = {};
    var normalizedTargets = {};
    targets.forEach(function(t) { normalizedTargets[normalizeStr(t)] = true; });

    lines.slice(1).forEach(function(line) {
        if (!line.trim()) return;
        var row = parseCSVRow(line);
        var target = normalizeStr(row[3] || '');
        var stars = parseInt(row[4], 10) || 0;
        if (normalizedTargets[target]) {
            sums[target] = (sums[target] || 0) + stars;
        }
    });
    return sums;
}

/* ── Balance check: reads Records & Redemptions live ── */
async function calculateBalances(targets) {
    var base = 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=out:csv&sheet=';
    var recordsCSV = '';
    var redemptionsCSV = '';

    var recordsResp = await fetch(base + 'Records');
    if (!recordsResp.ok) throw new Error('Cannot read Records sheet');
    recordsCSV = await recordsResp.text();

    try {
        var redemptionsResp = await fetch(base + 'Redemptions');
        if (redemptionsResp.ok) {
            var txt = await redemptionsResp.text();
            if (txt && !txt.trim().startsWith('<')) redemptionsCSV = txt;
        }
    } catch (ignored) { /* Redemptions sheet may not exist yet */ }

    var earned  = sumStarsFromCSV(recordsCSV, targets);
    var redeemed = sumStarsFromCSV(redemptionsCSV, targets);
    var balances = {};
    targets.forEach(function(t) {
        var key = normalizeStr(t);
        balances[t] = (earned[key] || 0) - (redeemed[key] || 0);
    });
    return balances;
}

/* ── UI functions ── */
function setActionMode(mode) {
    document.getElementById('actionMode').value = mode;
    var submitBtn = document.getElementById('submitBtn');
    hideBalanceError();
    if (mode === 'ADD') {
        document.getElementById('btnModeAdd').className = 'action-btn active-add';
        document.getElementById('btnModeDeduct').className = 'action-btn';
        submitBtn.className = '';
        submitBtn.textContent = 'Submit Stars';
        document.getElementById('starsLabel').textContent = 'Stars Awarded';
        document.getElementById('formHeader').textContent = '⭐ Star Reward System';
    } else {
        document.getElementById('btnModeDeduct').className = 'action-btn active-deduct';
        document.getElementById('btnModeAdd').className = 'action-btn';
        submitBtn.className = 'deduct-mode';
        submitBtn.textContent = 'Deduct Stars';
        document.getElementById('starsLabel').textContent = 'Stars to Deduct';
        document.getElementById('formHeader').textContent = '🎁 Reward Redemption';
    }
}

function setMode(mode) {
    document.getElementById('rewardType').value = mode;
    hideBalanceError();
    if (mode === 'class') {
        document.getElementById('btnClass').classList.add('active');
        document.getElementById('btnStudent').classList.remove('active');
        document.getElementById('classStreamSection').style.display = 'block';
        document.getElementById('studentStreamSection').style.display = 'none';
        document.getElementById('rewardingClass').setAttribute('required', 'required');
    } else {
        document.getElementById('btnStudent').classList.add('active');
        document.getElementById('btnClass').classList.remove('active');
        document.getElementById('classStreamSection').style.display = 'none';
        document.getElementById('studentStreamSection').style.display = 'block';
        document.getElementById('rewardingClass').removeAttribute('required');
    }
}

function populateStudents() {
    var cls = document.getElementById('studentClass').value;
    var sel = document.getElementById('studentSelect');
    sel.innerHTML = '<option value="" disabled selected>Select a student</option>';
    if (CLASS_STUDENTS[cls]) {
        CLASS_STUDENTS[cls].forEach(function(name) {
            var o = document.createElement('option');
            o.value = name; o.textContent = name;
            sel.appendChild(o);
        });
    }
}

function addStudentTag() {
    var val = document.getElementById('studentSelect').value;
    if (val && selectedStudents.indexOf(val) === -1) {
        selectedStudents.push(val);
        renderStudentTags();
    }
}

function removeStudentTag(name) {
    selectedStudents = selectedStudents.filter(function(s) { return s !== name; });
    renderStudentTags();
}

function renderStudentTags() {
    var c = document.getElementById('selectedStudentsList');
    c.innerHTML = '';
    selectedStudents.forEach(function(name) {
        var tag = document.createElement('div');
        tag.className = 'tag';
        var txt = document.createTextNode(name + ' ');
        var btn = document.createElement('span');
        btn.className = 'tag-remove';
        btn.textContent = '\u00d7';
        btn.addEventListener('click', function() { removeStudentTag(name); });
        tag.appendChild(txt);
        tag.appendChild(btn);
        c.appendChild(tag);
    });
    document.getElementById('studentNames').value = selectedStudents.join(',');
    hideBalanceError();
}

function resetPasscodeValidation() { document.getElementById('passcodeError').style.display = 'none'; }
function hideBalanceError() { var e = document.getElementById('balanceError'); e.style.display = 'none'; e.innerHTML = ''; }
function showBalanceError(msg) { var e = document.getElementById('balanceError'); e.style.display = 'block'; e.innerHTML = msg; }

/* ── PostMessage listener (server-side feedback) ── */
window.addEventListener('message', function(event) {
    if (!event.data || event.data.type !== 'STAR_RESULT' || !isSubmitting) return;
    isSubmitting = false;
    var submitBtn = document.getElementById('submitBtn');
    var actionMode = document.getElementById('actionMode').value;
    submitBtn.disabled = false;

    if (event.data.success) {
        var msg = event.data.mode === 'DEDUCT' ? '🎁 Stars Deducted Successfully!' : '⭐ Stars Submitted Successfully!';
        showToast(msg, 'success');
        setTimeout(function() { location.reload(); }, 1500);
    } else if (event.data.insufficientList) {
        var html = '❌ <strong>Server Rejected!</strong> Not enough stars.<br>';
        event.data.insufficientList.forEach(function(item) {
            html += '• <strong>' + escapeHTML(item.name) + '</strong> only has <strong>' + item.balance + ' star(s)</strong> remaining.<br>';
        });
        html += '<br>You requested: <strong>' + event.data.requested + ' star(s)</strong>.';
        showBalanceError(html);
        submitBtn.textContent = 'Deduct Stars';
    } else {
        showToast('Error: ' + (event.data.error || 'Unknown error'), 'error');
        submitBtn.textContent = actionMode === 'ADD' ? 'Submit Stars' : 'Deduct Stars';
    }
});

/* ── Form submission ── */
async function handleFormSubmit(event) {
    if (isSubmitting) return;
    event.preventDefault();
    hideBalanceError();

    var teacher = document.getElementById('teacherName').value;
    var code = document.getElementById('passcode').value;
    if (TEACHER_PASSCODES[teacher] && TEACHER_PASSCODES[teacher] !== code) {
        document.getElementById('passcodeError').style.display = 'block';
        return;
    }

    var targetMode = document.getElementById('rewardType').value;
    if (targetMode === 'student' && selectedStudents.length === 0) {
        showToast('Please add at least one student before submitting.', 'error');
        return;
    }

    var actionMode = document.getElementById('actionMode').value;
    var starsRequested = parseInt(document.getElementById('stars').value, 10);
    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;

    try {
        /* ── Client-side balance check for DEDUCT mode ── */
        if (actionMode === 'DEDUCT') {
            submitBtn.textContent = 'Checking Balance...';

            var targets = [];
            if (targetMode === 'class') {
                targets = [document.getElementById('rewardingClass').value];
            } else {
                targets = selectedStudents.slice();
            }

            var balances = await calculateBalances(targets);
            var insufficientList = [];
            targets.forEach(function(t) {
                var bal = balances[t] !== undefined ? balances[t] : 0;
                if (bal < starsRequested) {
                    insufficientList.push({ name: t, balance: bal });
                }
            });

            if (insufficientList.length > 0) {
                var html = '❌ <strong>Redemption Rejected!</strong> Not enough stars.<br>';
                insufficientList.forEach(function(item) {
                    html += '• <strong>' + escapeHTML(item.name) + '</strong> only has <strong>' + item.balance + ' star(s)</strong> remaining.<br>';
                });
                html += '<br>You requested: <strong>' + starsRequested + ' star(s)</strong>.';
                showBalanceError(html);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Deduct Stars';
                return;
            }
        }

        /* ── Submit via hidden iframe ── */
        submitBtn.textContent = 'Submitting...';
        isSubmitting = true;
        document.getElementById('rewardForm').submit();

        /* Fallback: if postMessage never arrives, assume success after iframe loads */
        document.getElementById('hidden_iframe').onload = function() {
            setTimeout(function() {
                if (isSubmitting) {
                    isSubmitting = false;
                    showToast(actionMode === 'DEDUCT' ? '🎁 Stars Deducted Successfully!' : '⭐ Stars Submitted Successfully!', 'success');
                    setTimeout(function() { location.reload(); }, 1500);
                }
            }, 1500);
        };

    } catch (error) {
        showToast('Error checking balance. Ensure Google Sheet is shared as "Anyone with link - Viewer".<br>' + escapeHTML(error.message), 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = actionMode === 'ADD' ? 'Submit Stars' : 'Deduct Stars';
    }
}
